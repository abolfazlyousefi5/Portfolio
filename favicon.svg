<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272E3A"/>
      <stop offset="0.55" stop-color="#181C23"/>
      <stop offset="1" stop-color="#0C1015"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FF9A66"/>
      <stop offset="1" stop-color="#FF5A26"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <ellipse cx="256" cy="300" rx="150" ry="120" fill="#FF5A26" opacity="0.16" filter="url(#soft)"/>

  <!-- A  (نارنجی) — سمت چپ تا خوانش AY از چپ به راست باشد -->
  <g fill="none" stroke="url(#accent)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 398 L126 176 Q134 152 152 152 Q170 152 178 176 L250 398"/>
  </g>
  <g stroke="url(#accent)" stroke-width="40" stroke-linecap="round">
    <path d="M96 300 H208"/>
  </g>

  <!-- Y  (سفید) — سمت راست -->
  <g fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M302 152 L376 268"/>
    <path d="M450 152 L376 268"/>
    <path d="M376 268 V398"/>
  </g>
</svg>
